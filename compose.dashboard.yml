services:
  paper-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    expose:
      - "8080"
    # Intentionally no `ports:` mapping: attach the Coolify HTTPS proxy privately.
    volumes:
      - dashboard_data:/data
    secrets:
      - dashboard_auth_token
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

volumes:
  dashboard_data:

secrets:
  dashboard_auth_token:
    file: ./secrets/dashboard_auth_token
